<!DOCTYPE html>

<html lang="en" xmlns="http://www.w3.org/1999/xhtml"> 
<head>
    <meta charset="utf-8"> 
    <title>Giriş Sayfası</title>
</head>
<body>
    <div class="login-container">
        <h2>Hesabınıza Giriş Yapın</h2>
        <form id="loginForm" method="POST">
            <div>
                <label for="username">Kullanıcı Adı:</label><br>
                <input type="text" id="username" name="username" required>
            </div>

            <br>

            <div>
                <label for="password">Şifre:</label><br>
                <input type="password" id="password" name="password" required>
            </div>
            <br>
            <button type="submit">Giriş Yap</button>
        </form>
        <p id="mesaj"></p>
    </div>
    <script>
        const form = document.getElementById('loginForm');
        const mesaj = document.getElementById('mesaj');
        form.addEventListener('submit', function (event) {
            event.preventDefault();
            const kullaniciAdi = document.getElementById('username').value;
            const sifre = document.getElementById('password').value;
            const dogruKullanici = "B251210054@sakarya.edu.tr";
            const dogruSifre = "B251210054";
            if (kullaniciAdi === dogruKullanici && sifre === dogruSifre) {
                mesaj.innerText = "Giriş Başarılı! Hoş geldin.";
                mesaj.style.color = "green";
                window.location.href="index.html"
            } else {
                mesaj.innerText = "Kullanıcı adı veya şifre hatalı!";
                mesaj.style.color = "red";
            }
        });
    </script>




</body>
</html>
