<!DOCTYPE html>

<html lang="en" xmlns="http://www.w3.org/1999/xhtml">
<head>
    <meta charset="utf-8">
    <title>Giriş Sayfası</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>
</head>
<body>
    <div id="app" class="login-container">
        <h2>Hesabınıza Giriş Yapın</h2>
        <form id="loginForm">
            <div>
                <label> Kullanıcı Adı (E-mail):</label><br>
                <input type="text" id="username" v-model="kullaniciAdi">
            </div>
            <br>
            <div>
                <label>Şifre:</label><br>
                <input type="password" id="password" v-model="sifre">
            </div>
            <br>
            <button type="button" onclick="nativeKontrol()">Native JS ile Giriş</button>
            <button type="button" @click="vueKontrol">Vue.js ile Giriş</button>
        </form>
        <p id="mesaj">{{ vueMesaj }}</p>
    </div>
    <script>
        //---ilk denetim js kısmı //
        function nativeKontrol() {
            const kadi = document.querySelector('input[type="text"]').value;
            const sifre = document.querySelector('input[type="password"]').value;
            const mesajAlani = document.getElementById('mesaj');

            if (kadi === "" || sifre === "") {
                alert("Lütfen tüm alanları doldurun!");
                return;
            }
            if (kadi === "B251210054@sakarya.edu.tr" && sifre === "B251210054") {
                mesajAlani.innerText = "Native JS: Giriş Başarılı!";
                mesajAlani.style.color = "green";
                setTimeout(() => { window.location.href = "index.html"; }, 1000);
            } else {
                mesajAlani.innerText = "Hatalı giriş!";
                mesajAlani.style.color = "red";
            }
        }
        //---ikinci denetim denetim kütüphane kısmı //
        const { createApp } = Vue;
        createApp({
            data() {
                return {
                    kullaniciAdi: '',
                    sifre: '',
                    vueMesaj: ''
                }
            },
            methods: {
                vueKontrol() {
                    if (this.kullaniciAdi === "B251210054@sakarya.edu.tr" && this.sifre === "B251210054") {
                        this.vueMesaj = "Vue.js: Giriş Başarılı!";
                        document.getElementById('mesaj').style.color = "green";
                        setTimeout(() => { window.location.href = "index.html"; }, 1000);
                    } else {
                        this.vueMesaj = "Vue.js: Bilgiler hatalı!";
                        document.getElementById('mesaj').style.color = "red";
                    }
                }
            }
        }).mount('#app');
    </script>



    <script src="script.js"></script>
</body>
</html>
